aid: egab
name: Egab
description: Egab is a journalism platform founded in late 2020 and headquartered in Cairo,
  Egypt, that connects local journalists across the Global South — the Middle East, Africa,
  and beyond (60+ countries) — with international media outlets. It specializes in solutions
  journalism, offering journalists mentoring, editorial support, skills development, and fair
  compensation from pitch to publication, while giving newsrooms cost-efficient access to
  authentic, exclusive stories and diverse local contributors without flying in reporters.
